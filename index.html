<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JHS 쇼츠 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#F3F3F7; --surface:#FFFFFF; --sunk:#EBECF2; --ink:#1C1E2B; --ink-2:#4A4E66; --muted:#7A7F95; --line:#E1E2EA; --line-2:#CDCFDB;
  --brown:#3D5BB8; --deep:#23264A; --ivory:#F6F4EE; --ebony:#12131C;
  --act-bg:#FCF1E3; --act-ink:#9A5512; --ok-bg:#E8F1EA; --ok-ink:#2F6B43;
  --orange:#D98A2B; --orange-d:#BF7419;
  --s1:#C7742B; --s2:#3D5BB8;   /* dataviz: 앰버(가로등) · 인디고(밤) */
  --side:312px; --top:60px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Pretendard Variable",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
.num{font-family:Inter,Pretendard,sans-serif;font-variant-numeric:tabular-nums}

/* top */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;text-decoration:none}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--deep);display:grid;place-items:center;color:var(--ivory);font-style:normal;font-size:13px}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.top .sp{flex:1}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(28,30,43,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line-2);background:var(--surface);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--ivory)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.orange:hover{background:var(--orange-d)}
.btn.lg{height:42px;padding:0 20px;font-size:14px;border-radius:11px}
.btn.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}

/* layout */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top))}
aside{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--line);padding:18px 12px 24px}
.side-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 8px 12px}
.side-h h2{margin:0;font-size:15px;font-weight:700}
.side-h span{color:var(--muted);font-size:12px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mitem{display:flex;gap:12px;width:100%;padding:8px;border-radius:12px;border:1px solid transparent;transition:background .15s,border-color .15s}
.mitem:hover{background:rgba(255,255,255,.6)}
.mitem.is-sel{background:var(--surface);border-color:var(--line-2);box-shadow:0 1px 3px rgba(28,30,43,.06)}
.mitem:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.mthumb{flex:none;width:40px;height:71px;border-radius:7px;overflow:hidden;background:var(--sunk);display:grid;place-items:center}
.mthumb img{width:100%;height:100%;object-fit:cover}
.mthumb .ph{font-size:11px;color:var(--muted);font-weight:600}
.mtext{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mmonth{font-size:11.5px;color:var(--muted)}
.mtitle{font-size:14px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mitem.is-sel .mtitle{font-size:16px}
.mmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.st{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.st-board,.st-act{background:var(--act-bg);color:var(--act-ink)}
.st-ok{background:var(--ok-bg);color:var(--ok-ink)}
.st-todo{background:transparent;border:1px solid var(--line-2);color:var(--muted)}
.avs{display:flex}
.av{border-radius:50%;object-fit:cover;border:2px solid var(--surface);background:var(--sunk)}
.av-sm{width:22px;height:22px;margin-left:-6px}.av-sm:first-child{margin-left:0}
.av-md{width:30px;height:30px;margin-left:-8px}.av-md:first-child{margin-left:0}

main{min-width:0;padding:28px 32px 72px}
.crumb{font-size:12.5px;color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:4px}
h1{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.25}
h2.sec{margin:0;font-size:18px}
h3{margin:0;font-size:15px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px;color:var(--ink-2);font-size:13px}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin:22px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.muted{color:var(--muted)}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.row-h span{font-size:12.5px;color:var(--muted)}

/* 완료 보드 */
.sb{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.player{position:sticky;top:calc(var(--top) + 20px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.player video{width:100%;aspect-ratio:9/16;border-radius:10px;background:var(--ebony);display:block}
.pinfo{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 2px;font-size:12.5px;color:var(--ink-2)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.cut{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s}
.cut:hover{border-color:var(--line-2);box-shadow:0 4px 14px rgba(28,30,43,.08);transform:translateY(-1px)}
.cut.is-now{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cframe{position:relative;aspect-ratio:9/16;background:var(--ebony);display:block}
.cframe img{width:100%;height:100%;object-fit:cover;display:block}
.tagbox{position:absolute;top:8px;font-size:11px;font-weight:700;color:var(--ivory);background:rgba(18,19,28,.62);padding:2px 7px;border-radius:6px;font-family:Inter,Pretendard,sans-serif}
.cbody{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px}
.ctitle{font-weight:600;font-size:14px}
.csmall{font-size:11.5px;color:var(--muted)}
.ccap{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}
.mcard img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.mcard>div{flex:1;min-width:0}
.mname{font-weight:700;font-size:15px}
.mcode{font-weight:500;font-size:11.5px;color:var(--muted);margin-left:4px;font-family:Inter,Pretendard,sans-serif}
.mrole{font-size:12.5px;color:var(--ink-2)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;max-width:760px}
.hist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hist b{display:block;font-size:14px;margin-bottom:2px}
.hist span{color:var(--ink-2);font-size:13px}
.empty{max-width:560px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px 28px}
.empty h2{margin:10px 0 6px;font-size:21px}
.empty p{color:var(--ink-2);margin:0 0 18px}
.empty .avs{justify-content:center;margin-bottom:6px}

/* 프로파일 */
.prof{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(var(--top) + 20px)}
.plist .mcard{cursor:pointer;text-align:left}
.plist .mcard.is-sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pdetail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.phero{border-radius:16px;overflow:hidden;background:var(--sunk);aspect-ratio:9/16}
.phero img{width:100%;height:100%;object-fit:cover;display:block}
.ptitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ptitle h2{margin:0;font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.spec{display:grid;grid-template-columns:96px minmax(0,1fr);border-top:1px solid var(--line)}
.spec dt,.spec dd{margin:0;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.spec dt{color:var(--muted)}
.spec ul{margin:0;padding-left:18px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.gal button{border-radius:10px;overflow:hidden;background:var(--sunk);position:relative;aspect-ratio:9/16;border:1px solid var(--line)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;color:var(--ivory);background:rgba(18,19,28,.62);padding:2px 7px;border-radius:6px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(12,13,20,.88);display:grid;place-items:center;padding:24px}
.lb img{max-width:min(92vw,720px);max-height:86vh;border-radius:12px}
.lb[hidden]{display:none}
.lb .x{position:absolute;top:16px;right:20px;color:#fff;font-size:28px}

/* 대시보드 */
.dmeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0}
.dmeta div{background:var(--surface);padding:12px 16px}
.dmeta dt{font-size:12px;color:var(--muted);margin:0}
.dmeta dd{margin:2px 0 0;font-weight:600;font-size:14px}
.sample{font-size:12px;font-weight:600;color:var(--act-ink);background:var(--act-bg);padding:3px 10px;border-radius:999px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.hl{border-color:var(--ink)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;position:relative;min-width:0}
.chart.wide{grid-column:1 / -1}
.chart h3{font-size:15px}
.chart .sub{font-size:12px;color:var(--muted);margin:2px 0 10px}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ivory);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .08s;z-index:5}
.tip b{font-family:Inter,Pretendard,sans-serif}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.tbl td.r,.tbl th.r{text-align:right}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:13px}
.fbar{height:26px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.frow .r{text-align:right;color:var(--ink-2)}
.frow .r b{color:var(--ink)}

/* 주차 워크플로우 */
.srv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.srv i{width:7px;height:7px;border-radius:50%;background:currentColor}
.srv.on{background:var(--ok-bg);color:var(--ok-ink)}
.srv.off{background:var(--act-bg);color:var(--act-ink)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:12px 16px;margin:16px 0 0;font-size:13px}
.banner code{background:var(--sunk);padding:2px 6px;border-radius:5px}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:22px 0 22px;list-style:none;padding:0}
.stepper li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.stepper li b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px;color:var(--ink-2);font-family:Inter,Pretendard,sans-serif}
.stepper li.cur{border-color:var(--ink);color:var(--ink);font-weight:600}
.stepper li.cur b{background:var(--ink);color:var(--ivory)}
.stepper li.done{color:var(--ink-2)}
.stepper li.done b{background:var(--ok-bg);color:var(--ok-ink)}
.concepts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ccard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.ccard.rec{border-color:var(--ink)}
.ccard .top2{display:flex;justify-content:space-between;align-items:center}
.ccard .letter{font-family:Inter,Pretendard,sans-serif;font-weight:700;font-size:13px;color:var(--muted)}
.ccard h3{font-size:19px;letter-spacing:-.01em}
.ccard p{margin:0;color:var(--ink-2);font-size:13.5px}
.ccard .why{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.cuts-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:0;overflow:hidden;transition:max-height .25s}
.cuts-mini.open{max-height:900px}
.cuts-mini li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line)}
.cuts-mini li b{font-family:Inter,Pretendard,sans-serif;color:var(--muted)}
.cuts-mini .cap{color:var(--ink);font-weight:600;white-space:pre-line}
.ccard .foot{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between}
.facts{margin-top:18px}
.facts li{display:flex;gap:10px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.facts ul{list-style:none;margin:8px 0 0;padding:0}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .4s}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.kcard.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.kimg{position:relative;aspect-ratio:9/16;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px}
.kimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kimg .badge{position:absolute;right:8px;top:8px}
.spin{width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.kbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.review{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.drawer{position:sticky;top:calc(var(--top) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.drawer .big{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px}
.drawer .big img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;cursor:zoom-in}
.vers{display:flex;gap:6px;flex-wrap:wrap}
.vers button{width:44px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative}
.vers button img{width:100%;height:100%;object-fit:cover}
.vers button.on{border-color:var(--ink)}
.vers button span{position:absolute;left:2px;bottom:2px;font-size:9px;color:#fff;background:rgba(0,0,0,.55);padding:0 3px;border-radius:3px}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px}
.sug .btn{height:28px;padding:0 10px;font-size:12px}
textarea{width:100%;min-height:76px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px;resize:vertical;background:var(--surface);color:var(--ink)}
textarea:focus{outline:2px solid var(--brown);outline-offset:1px}
.logbox{margin-top:20px;font-size:12px;color:var(--ink-2)}
.logbox summary{cursor:pointer;color:var(--muted)}
.logbox ol{margin:8px 0 0;padding-left:18px;max-height:180px;overflow:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:10px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* 스토리보드 원본 */
.doc .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:4px}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:18px}
.dsec h2{margin:0 0 14px;font-size:18px}
.dhero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.dhero img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;display:block}
.doc code{font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:5px;word-break:break-all}
.dmodels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dmodel{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:12px;padding:14px}
.dmodel img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px}
.kv{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;margin:10px 0 0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.kv dd.eng{font-size:12px;color:var(--ink-2);line-height:1.45}

<body>

  <h1>JHS 쇼츠 스튜디오</h1><p>허용된 계정으로 로그인하세요. 작업은 스튜디오 PC가 처리합니다.</p>

  <button id="gBtn" type="submit">로그인</button><p class="err" id="gErr" hidden></p>
</form></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="studio_data.js"></script>
<script>
const D = window.STUDIO_DATA, MODELS = D.models;
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const short = n => n>=1e8?(n/1e8).toFixed(1)+'억':n>=1e4?(n/1e4).toFixed(n>=1e5?0:1)+'만':fmt(n);
const av = (ids, size='sm') => ids.filter(k=>MODELS[k]).map(k => `<img class="av av-${size}" src="${MODELS[k].avatar}" alt="${MODELS[k].name}" title="${MODELS[k].name} · ${esc(MODELS[k].role)}">`).join('');
const names = ids => ids.filter(k=>MODELS[k]).map(k=>MODELS[k].name).join(' · ');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }
function lightbox(src){ const l=$('#lb'); l.querySelector('img').src=src; l.hidden=false; }
$('#lb').addEventListener('click', ()=> $('#lb').hidden=true);
const XF=0.5;   /* 최종 편집 크로스페이드(초) — pipeline.assemble 과 같은 값 */

/* ── 주차 계산 (서버 없이 열었을 때도 캘린더를 보여 주기 위해) ── */
const kstToday=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
const addDays=(s,n)=>{ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
function isoWeek(s){ const d=new Date(s+'T00:00:00Z'), day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3);
  const y=d.getUTCFullYear(), j4=new Date(Date.UTC(y,0,4)), w=1+Math.round(((d-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7); return `${y}-W${String(w).padStart(2,'0')}`; }
function weekMonday(w){ const [y,n]=w.split('-W').map(Number), j4=new Date(Date.UTC(y,0,4)), m=new Date(j4); m.setUTCDate(j4.getUTCDate()-((j4.getUTCDay()+6)%7)+(n-1)*7); return m.toISOString().slice(0,10); }
const wshort = w => w.split('-')[1];
const md = s => s.slice(5).replace('-','/');
function trackOfWeek(w){ const i=Math.round((Date.parse(weekMonday(w))-Date.parse(weekMonday(D.base_week)))/(7*864e5)); const n=D.tracks.length; return D.tracks[((i%n)+n)%n]; }
function localWeeks(){ const t=kstToday(), cur=isoWeek(t); const out=[];
  for(let k=-4;k<8;k++){ const w=isoWeek(addDays(t,k*7)), m=weekMonday(w), tr=trackOfWeek(w);
    out.push({w, range:[m,addDays(m,6)], publish:addDays(m,4), current:w===cur, stage:'plan', title:'', type:'', models:[], thumb:null, track:`#${tr.no} ${tr.title_en}`, album:D.albums[tr.album].name}); }
  return out; }

/* ── 실행 환경 ──
   localhost 에서 열면 로컬 스튜디오 서버(API)를 쓰고, 외부 주소에서 열면 Supabase 미러(CLOUD)를 씁니다.
   CLOUD 에서도 무거운 작업(기획·이미지·영상)은 스튜디오 PC의 브리지가 처리합니다. */
const CLOUD = /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const SB_URL = 'https://vrlxqsowbuypsgpwxtlz.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZybHhxc293YnV5cHNncHd4dGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MTU5MzcsImV4cCI6MjEwNjM5MTkzN30.kIk8Ep5A040Uzrxl_JZMqQ9gqvHrXIT4SHhHgitN9K0';
let SB = null, BRIDGE_ON = false;
const SIGNED = new Map();
const LONG_ACTS = ['plan','generate','revise','render','replan'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
let API=false, WEEKS=[], CUR=isoWeek(kstToday()), W=null, MST=null, MCON=null, TRENDS=null, TRACK=null, META={}, poll=null;
async function ping(){ if(CLOUD||!location.protocol.startsWith('http')) return false; try{ const r=await fetch('/api/ping'); return r.ok; }catch(e){ return false; } }

/* ── 클라우드: 서명 URL · 브리지 상태 ── */
async function signKeys(keys){
  const need=[...new Set(keys.filter(k=>k && !(SIGNED.has(k) && SIGNED.get(k).exp>Date.now())))];
  if(!need.length) return;
  const {data,error}=await SB.storage.from('shorts-studio').createSignedUrls(need, 3600);
  if(error) throw error;
  (data||[]).forEach(d=>{ if(d && d.signedUrl) SIGNED.set(d.path, {url:d.signedUrl, exp:Date.now()+50*60e3}); });
}
const urlOf = k => (k && SIGNED.get(k)) ? SIGNED.get(k).url : '';
async function bridgeStatus(){
  const {data}=await SB.from('ss_bridge_status').select('last_seen').eq('id',1).maybeSingle();
  BRIDGE_ON = !!(data && Date.now()-Date.parse(data.last_seen) < 90e3); return BRIDGE_ON;
}
async function isOperator(){ const {data,error}=await SB.rpc('ss_is_operator'); return !error && data===true; }
function gateLogin(msg){
  return new Promise(res=>{
    const g=$('#gate'), err=$('#gErr'); g.hidden=false;
    if(msg){ err.hidden=false; err.textContent=msg; }
    $('#gateForm').onsubmit=async e=>{
      e.preventDefault(); const b=$('#gBtn'); b.disabled=true; b.textContent='확인 중…';
      const {error}=await SB.auth.signInWithPassword({email:$('#gEmail').value.trim(), password:$('#gPw').value});
      if(!error && await isOperator()){ g.hidden=true; res(); return; }
      if(!error) await SB.auth.signOut();
      b.disabled=false; b.textContent='로그인'; err.hidden=false;
      err.textContent = error ? '로그인하지 못했습니다 — '+error.message : '허용 목록에 없는 계정입니다';
    };
  });
}
async function cloudBoot(){
  SB = window.supabase.createClient(SB_URL, SB_KEY);
  const {data:{session}} = await SB.auth.getSession();
  if(!session) await gateLogin();
  else if(!(await isOperator())){ await SB.auth.signOut(); await gateLogin('허용 목록에 없는 계정입니다'); }
  const lo=$('#btn-logout'); lo.hidden=false; lo.onclick=async()=>{ await SB.auth.signOut(); location.reload(); };
  await bridgeStatus().catch(()=>{}); setInterval(()=>bridgeStatus().catch(()=>{}), 30e3);
  return true;
}
async function cloudWeeks(){
  const {data,error}=await SB.from('ss_weeks').select('week,stage,summary,publish,range').order('week',{ascending:true});
  if(error) throw error;
  await signKeys((data||[]).map(r=>r.summary && r.summary.thumb_key).filter(Boolean));
  return (data||[]).map(r=>{ const s=r.summary||{};
    return {...s, w:r.week, stage:r.stage, range:r.range||s.range, publish:r.publish||s.publish, current:r.week===CUR,
            thumb: urlOf(s.thumb_key)||null, running: !!s.running}; });
}
async function cloudState(w){
  const [a,b,c]=await Promise.all([
    SB.from('ss_weeks').select('*').eq('week',w).maybeSingle(),
    SB.from('ss_concepts').select('data').eq('week',w).maybeSingle(),
    SB.from('ss_cuts').select('*').eq('week',w)]);
  for(const r of [a,b,c]) if(r.error) throw r.error;
  const row = a.data || {week:w, stage:'plan', log:[], track:{}};
  const cuts = {};
  (c.data||[]).forEach(r=>{ cuts[r.cut_id]={status:r.status, versions:r.versions||[], current:r.current, suggestions:r.suggestions||[]}; });
  const keys=[]; Object.values(cuts).forEach(x=>x.versions.forEach(v=>keys.push(v.key)));
  const pk = row.video && row.video.poster_key; if(pk) keys.push(pk);
  await signKeys(keys);
  Object.values(cuts).forEach(x=>x.versions.forEach(v=>{ v.file=urlOf(v.key); }));
  const video = row.video ? {...row.video, file:'', poster:urlOf(pk)} : null;
  return { state:{week:w, stage:row.stage, concept:row.concept, cuts, job:row.job, video, log:row.log||[]},
           concepts: b.data ? b.data.data : null, trends: row.trends||null, track: row.track||{},
           publish: row.publish, range: row.range||[] };
}
async function cloudPost(act, body){
  if(!SB) return null;
  const {data:{user}} = await SB.auth.getUser();
  const ins = await SB.from('ss_commands').insert({week:W, action:act, payload:body, status:'pending',
                                                  requested_by:(user.email||'').toLowerCase()}).select('id').single();
  if(ins.error){ toast('요청을 보내지 못했습니다 — '+ins.error.message); return null; }
  const id = ins.data.id, long = LONG_ACTS.includes(act), t0 = Date.now();
  if(!BRIDGE_ON) toast('스튜디오 PC가 꺼져 있는 것 같습니다. 켜지면 요청이 처리됩니다');
  while(Date.now()-t0 < 90e3){
    await sleep(1200);
    const {data:c} = await SB.from('ss_commands').select('status,error').eq('id',id).single();
    if(c.status==='error'){ toast(c.error||'작업이 실패했습니다'); await getState(W); return null; }
    if(c.status==='done'){ await getState(W); return {ok:true, state:MST}; }
    if(long && c.status==='claimed'){ await getState(W); if(MST.job && MST.job.running) return {ok:true, state:MST, queued:true}; }
  }
  toast('스튜디오 PC가 응답하지 않습니다. 요청은 대기열에 남아 있습니다'); return null;
}

/* ── 로컬 서버 · 공통 ── */
async function loadWeeks(){
  if(CLOUD && SB){ try{ const ws=await cloudWeeks(); if(ws.length){ WEEKS=ws; return; } }catch(e){ toast('목록을 불러오지 못했습니다 — '+e.message); } }
  else if(API){ try{ const j=await (await fetch('/api/weeks')).json(); WEEKS=j.weeks; CUR=j.current; return; }catch(e){} }
  WEEKS=localWeeks();
}
async function getState(w){
  if(CLOUD){
    if(!SB) return MST;
    const x=await cloudState(w); MST=x.state; MCON=x.concepts; TRENDS=x.trends; TRACK={...x.track}; META={publish:x.publish, range:x.range}; W=w; return MST;
  }
  if(!API){ const x=WEEKS.find(k=>k.w===w)||{}; const tr=trackOfWeek(w); MST={week:w,stage:'plan',cuts:{},log:[]}; MCON=null; TRENDS=null;
    TRACK={...tr, album_name:D.albums[tr.album].name, album_label:D.albums[tr.album].label}; META={publish:x.publish||addDays(weekMonday(w),4), range:x.range||[weekMonday(w),addDays(weekMonday(w),6)]}; W=w; return MST; }
  const j=await (await fetch('/api/state?w='+w)).json(); MST=j.state; MCON=j.concepts; TRENDS=j.trends; TRACK=j.track; META={publish:j.publish, range:j.range}; SUBS=!!j.subtitles; W=w; return MST;
}
async function post(act, body={}){
  if(CLOUD) return cloudPost(act, body);
  if(!API){ toast('로컬 스튜디오 서버가 꺼져 있습니다 — start_studio.bat 실행 후 이용하세요'); return null; }
  const r=await fetch('/api/'+act,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({w:W,...body})});
  const j=await r.json(); if(!j.ok){ toast(j.error||'요청 실패'); return null; } MST=j.state; return j;
}

/* ── 사이드바 ── */
const SMAP={plan:['기획 전','todo'],select:['기획안 3종','board'],images:['이미지 생성','act'],review:['검토·수정','act'],render:['영상 제작','act'],done:['제작 완료','ok']};
function renderSide(sel){
  $('#wcount').textContent=`${WEEKS.length}주`;
  $('#mlist').innerHTML = WEEKS.map(x => {
    let [sl,sk]=SMAP[x.stage]||SMAP.plan; if(x.running){ sl='작업 중'; sk='act'; }
    const th = x.thumb ? `<img src="${x.thumb}" alt="">` : `<span class="ph">${wshort(x.w)}</span>`;
    return `<li><a class="mitem${x.w===sel?' is-sel':''}" href="#/w/${x.w}" style="text-decoration:none" ${x.w===sel?'aria-current="page"':''}>
      <span class="mthumb">${th}</span><span class="mtext"><span class="mmonth"><span class="num">${wshort(x.w)} · ${md(x.range[0])}–${md(x.range[1])}</span>${x.current?' · <b class="nowtag">이번 주</b>':''}</span>
      <span class="mtitle">${x.title?esc(x.title):`<span class="muted" style="font-weight:500">${esc(x.track)}</span>`}</span>
      <span class="mmeta"><span class="st st-${sk}">${sl}</span><span class="avs">${av(x.models)}</span></span></span></a></li>`;
  }).join('');
  const s=$('#mlist .is-sel'); if(s) s.scrollIntoView({block:'nearest'});
}

/* ── 주차 워크플로우 ── */
const STAGES=['plan','select','images','review','render','done'], SLABEL=['트렌드 · 기획','기획안 선택','이미지 생성','검토 · 수정','영상 제작','완료'];
let selCut=null, draft={}, doneTab='board', SUBS=false;
function stBadge(s){ return {pending:'<span class="st st-todo">대기</span>',generating:'<span class="st st-act">생성 중</span>',reviewing:'<span class="st st-act">AI 검토 중</span>',ready:'<span class="st">검토 필요</span>',approved:'<span class="st st-ok">승인</span>'}[s]||'<span class="st st-todo">대기</span>'; }
const typeChip = t => `<span class="st ${t==='앨범 소개'?'st-album':'st-hook'}">${esc(t)}</span>`;
function trackLine(){ const T=TRACK; if(!T) return ''; return `${esc(T.album_label)} 『${esc(T.album_name)}』 #${T.no} ${esc(T.title_en)}${T.title_ko?' / '+esc(T.title_ko):''}`; }
function cutStarts(cuts){ let t=0; return cuts.map((c,i)=>{ const s=t; t+=(c.out-c.in)-XF; return s; }); }
function cutTotal(cuts){ return cuts.reduce((a,c)=>a+(c.out-c.in),0)-XF*(cuts.length-1); }

function viewWeek(){
  const S = MST, si = STAGES.indexOf(S.stage), con = (S.concept&&MCON) ? MCON.concepts.find(c=>c.id===S.concept) : null;
  const job = S.job && S.job.running ? S.job : null;
  $('#main').innerHTML = `
  <div class="crumb num">${W} · ${md(META.range[0])}–${md(META.range[1])} · 금요일 ${md(META.publish)} 업로드${W===CUR?' · <b class="nowtag">이번 주</b>':''}</div>

    <div class="meta"><span>이번 주 트랙 · ${trackLine()}</span>${MCON&&MCON.target?`<span class="dot"></span><span>타깃: ${esc(MCON.target)}</span>`:''}<span class="dot"></span>
    <span class="srv ${(API||(CLOUD&&BRIDGE_ON))?'on':'off'}"><i></i>${API?'스튜디오 서버 연결됨':CLOUD?(BRIDGE_ON?'스튜디오 PC 연결됨':'스튜디오 PC 오프라인'):'미리보기 모드'}</span></div></div>

  ${API||(CLOUD&&BRIDGE_ON)?'':CLOUD?`<div class="banner"><span>스튜디오 PC가 꺼져 있습니다. 기획·이미지·영상 요청은 PC가 켜지면 처리됩니다. 지금은 보기만 가능합니다.</span></div>`:`<div class="banner"><span>지금은 미리보기 모드입니다. 트렌드 수집·기획안·이미지·영상을 실제로 만들려면 프로젝트 폴더의 <code>start_studio.bat</code>을 실행해 서버 주소로 여세요.</span><span class="muted">http://localhost:8766/app/index.html</span></div>`}
  <ol class="stepper">${SLABEL.map((l,i)=>`<li class="${i===si?'cur':i<si?'done':''}"><b>${i<si?'✓':i+1}</b>${l}</li>`).join('')}</ol>

  <details class="logbox"><summary>작업 기록 ${(S.log||[]).length}건</summary><ol>${(S.log||[]).slice().reverse().map(l=>`<li><span class="num">${l.t}</span> ${esc(l.msg)}</li>`).join('')}</ol></details>`;
  if($('#b-reset')) $('#b-reset').onclick=async()=>{ if(confirm('선택한 기획안과 생성한 이미지 진행 상태를 처음으로 되돌립니다. 계속할까요?')){ await post('reset'); route(); } };
  const Wf=$('#wf');
  const progress = job ? `<div class="card" style="margin-bottom:16px"><div class="row-h" style="margin:0"><h3>${esc(job.msg)}</h3><span class="num">${job.done} / ${job.total||'?'}</span></div><div class="prog"><i style="width:${job.total?job.done/job.total*100:3}%"></i></div><span class="muted" style="font-size:12px">창을 닫아도 서버에서 계속 진행됩니다</span></div>` : (S.job&&S.job.error?`<div class="banner" style="margin:0 0 16px"><span>작업 오류: ${esc(S.job.error)}</span></div>`:'');

  if(S.stage==='plan'){
    const A=D.albums[TRACK.album];
    Wf.innerHTML = progress + `<div class="planrow">
      <div class="card"><h2 class="sec">이번 주 기획 만들기</h2>
        <ol class="howto"><li><b>트렌드 수집</b> — 최근 30일 고양이 쇼츠 중 조회수·좋아요 상위 영상을 YouTube에서 가져옵니다.</li>
          <li><b>기획안 3종 작성</b> — 상위 영상의 후킹 패턴을 밴드 이야기로 옮긴 <b>후킹 스토리 2안</b>과, 이번 주 트랙을 알리는 <b>앨범 소개 1안</b>.</li>
          <li><b>선택 후 제작</b> — 키프레임 생성 → AI 검토·수정 → 모션 영상 + 음원 → 9:16 쇼츠 완성.</li></ol>
        ${job?'':`<button class="btn primary lg" id="b-plan">트렌드 수집 · 기획안 3종 만들기</button>`}
        <p class="muted" style="font-size:12px;margin:10px 0 0">매주 월요일 09:00 자동 실행(작업 스케줄러 등록 시) — 이미 만들어진 주는 건너뜁니다.</p></div>

        <div class="muted" style="font-size:12.5px;margin-top:2px">${esc(A.label)} 『${esc(A.name)}』 · ${esc(A.release)} 발매</div>
        <p style="font-size:13px;color:var(--ink-2);margin:8px 0 10px">${esc(A.story)}</p>
        ${API?`<audio controls preload="none" src="/api/audio?w=${W}" style="width:100%"></audio>`:''}</div></div></div>

    if($('#b-plan')) $('#b-plan').onclick=async()=>{ if(await post('plan')){ toast('트렌드 수집과 기획안 작성을 시작했습니다'); startPoll(); route(); } };
    return;
  }
  if(S.stage==='select'){
    Wf.innerHTML = progress + `<div class="row-h"><h2 class="sec">기획안 3종 — 이번 주에는 어떤 이야기로 갈까요?</h2><span>하나를 고르면 그 안으로 키프레임 이미지를 생성합니다</span></div>
    <div class="concepts">${MCON.concepts.map(c=>`<div class="ccard${c.recommend?' rec':''}">
      <div class="top2"><span class="letter">${c.id}안 · ${typeChip(c.type)}</span>${c.recommend?'<span class="st st-ok">추천</span>':''}</div>
      <h3>${esc(c.name)}</h3><p>${esc(c.logline)}</p>
      <div class="chips" style="margin:0">${c.hook?`<span class="chip chip-b">훅 · ${esc(c.hook)}</span>`:''}${c.strengths.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>
      <div class="meta" style="margin:0"><span class="avs">${av(c.models,'md')}</span><span>${names(c.models)||'인물 없음'}</span><span class="dot"></span><span class="num">${c.cuts.length}컷 · ${c.length}</span></div>
      <button class="btn" style="align-self:flex-start" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'컷 구성 접기':'컷 구성 보기'">컷 구성 보기</button>
      <ul class="cuts-mini">${c.cuts.map(k=>`<li><b>${k.id}</b><div><div>${esc(k.title)} — <span class="muted">${esc(k.scene)}</span></div></div></li>`).join('')}</ul>
      <div class="why">${esc(c.why)}${refLinks(c)}</div>
      <div class="foot"><span class="muted" style="font-size:12px">이미지 ${c.cuts.filter(k=>k.kind!=='cover').length}장 생성</span><button class="btn ${c.recommend?'primary':''}" data-pick="${c.id}">이 안으로 진행</button></div>
    </div>`).join('')}</div>
    <div class="actions" style="margin-top:14px"><button class="btn" id="b-replan">트렌드 다시 수집해 새 기획안 만들기</button></div>
    ${trendTable()}`;
    Wf.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{ if(await post('select',{concept:b.dataset.pick})){ toast(`${b.dataset.pick}안을 선택했습니다`); route(); } });
    $('#b-replan').onclick=async()=>{ if(confirm('지금 기획안 3종을 버리고 트렌드를 다시 수집해 새로 만듭니다. 계속할까요?')&&await post('replan')){ startPoll(); route(); } };
    return;
  }

  const cuts=con.cuts, cs=id=>S.cuts[id]||{versions:[],current:0,status:'pending',suggestions:[]};
  const img=id=>{ const c=cs(id); return c.versions.length? c.versions[c.current].file : null; };
  const nApproved=cuts.filter(c=>cs(c.id).status==='approved').length;
  const summary = `<div class="card" style="margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between">
    <div><div class="crumb">${con.id}안 · ${esc(con.type)}${con.hook?' · '+esc(con.hook):''}</div><h3 style="font-size:17px;margin-top:2px">${esc(con.name)}</h3></div>
    <div class="meta" style="margin:0"><span class="avs">${av(con.models,'md')}</span><span class="num">${cuts.length}컷 · ${con.length}</span><span class="dot"></span><span>BGM #${TRACK.no} ${esc(TRACK.title_en)}</span></div></div>`;

  if(S.stage==='images'){
    const any=cuts.some(c=>cs(c.id).versions.length);

      ${job?'':`<button class="btn primary lg" id="b-gen">${any?'남은 컷 이어서 생성':'키프레임 '+cuts.length+'장 생성 시작'}</button>`}
      <div class="kgrid">${cuts.map(c=>kcard(c,cs(c.id),img(c.id))).join('')}</div>`;
    if($('#b-gen')) $('#b-gen').onclick=async()=>{ if(await post('generate')){ toast('이미지 생성을 시작했습니다'); startPoll(); route(); } };
    return;
  }
  if(S.stage==='review'){
    if(!selCut||!cuts.find(c=>c.id===selCut)) selCut=cuts[0].id;
    const c=cuts.find(x=>x.id===selCut), st=cs(c.id), cur=img(c.id);
    Wf.innerHTML = summary + progress + `<div class="row-h"><h2 class="sec">검토 · 수정 <span class="muted num" style="font-size:14px;font-weight:500">승인 ${nApproved} / ${cuts.length}</span></h2>
      <div class="actions"><button class="btn" id="b-all">검토 끝난 컷 모두 승인</button><button class="btn primary" id="b-next" ${nApproved<cuts.length?'disabled':''}>영상 제작 단계로 →</button></div></div>
      <div class="review"><div class="kgrid" style="margin:0">${cuts.map(k=>kcard(k,cs(k.id),img(k.id),true)).join('')}</div>
      <div class="drawer">
        <div class="row-h" style="margin:0"><h3>${c.id} · ${esc(c.title)}</h3>${stBadge(st.status)}</div>
        <div class="big">${cur?`<img src="${cur}" alt="${esc(c.title)}" onclick="lightbox('${cur}')">`:'<div class="kimg">이미지 없음</div>'}
          <div><div class="csmall">장면</div><div style="font-size:13px">${esc(c.scene)}</div>
          <div class="csmall" style="margin-top:8px">버전</div><div class="vers">${st.versions.map((v,i)=>`<button class="${i===st.current?'on':''}" data-ver="${i}" title="${esc(v.note)} · ${v.t}"><img src="${v.file}" alt=""><span>v${i+1}</span></button>`).join('')}</div></div></div>
        ${c.kind==='cover'?`<p class="muted" style="font-size:13px;margin:0">실제 앨범 커버를 그대로 씁니다 — 생성·수정 대상이 아닙니다.</p>`:`
        <div><div class="row-h" style="margin:0 0 8px"><h3 style="font-size:14px">AI 수정안</h3><span>이미지를 직접 보고 제안</span></div>
          <div class="sugs">${(st.suggestions||[]).map((s,i)=>`<div class="sug"><span>${esc(s.text)}</span><button class="btn" data-sug="${i}">적용</button></div>`).join('')||'<span class="muted" style="font-size:13px">제안 없음</span>'}</div></div>
        <div><div class="csmall" style="margin-bottom:6px">수정 지시 (한국어 또는 영어)</div><textarea id="ta" placeholder="예: 리나를 화면 위쪽으로 올리고, 가로등 빛을 조금 더 따뜻하게">${esc(draft[c.id]||'')}</textarea></div>`}
        <div class="actions">${c.kind==='cover'?'':`<button class="btn primary" id="b-rev" ${job?'disabled':''}>수정 이미지 생성</button>`}
          ${st.status==='approved'?`<button class="btn" id="b-unap">승인 취소</button>`:`<button class="btn" id="b-ap" ${st.status!=='ready'?'disabled':''}>이 컷 승인</button>`}</div>
      </div></div>`;
    Wf.querySelectorAll('.kcard').forEach(b=>b.onclick=()=>{ selCut=b.dataset.id; viewWeek(); });
    Wf.querySelectorAll('[data-ver]').forEach(b=>b.onclick=async()=>{ if(await post('version',{cut:c.id,idx:+b.dataset.ver})) viewWeek(); });
    Wf.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{ const s=st.suggestions[+b.dataset.sug]; draft[c.id]=s.instruction||s.text; $('#ta').value=draft[c.id]; $('#ta').focus(); });
    if($('#ta')) $('#ta').oninput=e=>draft[c.id]=e.target.value;
    if($('#b-rev')) $('#b-rev').onclick=async()=>{ const t=(draft[c.id]||'').trim(); if(!t){ toast('수정 지시를 입력하거나 AI 수정안의 [적용]을 누르세요'); return; } if(await post('revise',{cut:c.id,instruction:t})){ draft[c.id]=''; toast(`${c.id} 수정 이미지를 생성합니다`); startPoll(); viewWeek(); } };
    if($('#b-ap')) $('#b-ap').onclick=async()=>{ if(await post('approve',{cut:c.id,approved:true})){ const nx=cuts.find(k=>cs(k.id).status!=='approved'&&k.id!==c.id); if(nx) selCut=nx.id; viewWeek(); refreshSide(); } };
    if($('#b-unap')) $('#b-unap').onclick=async()=>{ if(await post('approve',{cut:c.id,approved:false})) viewWeek(); };
    $('#b-all').onclick=async()=>{ if(await post('approve_all')) viewWeek(); };
    $('#b-next').onclick=async()=>{ if(await post('back',{stage:'render'})){ route(); } };
    return;
  }
  if(S.stage==='render'){
    Wf.innerHTML = summary + progress + `<div class="row-h"><h2 class="sec">영상 제작</h2><span>승인된 이미지마다 모션 영상(Kling 2.5)을 만들고, 0.5초 크로스페이드·이번 주 트랙 BGM으로 이어 붙입니다(${SUBS?'자막 포함':'자막 없음'})</span></div>
      ${job?'':`<div class="actions" style="margin-bottom:16px"><button class="btn primary lg" id="b-render">쇼츠 영상 제작 시작</button><button class="btn lg" id="b-back">← 검토로 돌아가기</button></div>`}
      <div class="card" style="padding:0;overflow-x:auto"><table class="tbl"><thead><tr><th>컷</th><th>이미지</th><th>움직임</th><th class="r">사용 구간</th></tr></thead><tbody>
      ${cuts.map(c=>`<tr><td class="num"><b>${c.id}</b></td><td>${img(c.id)?`<img src="${img(c.id)}" style="width:44px;aspect-ratio:9/16;object-fit:cover;border-radius:6px">`:''}</td><td style="min-width:240px">${c.kind==='cover'?'<span class="muted">앨범 커버 느린 줌인 (fal 미사용)</span>':esc(c.motion)}</td><td class="r num">${(c.out-c.in).toFixed(1)}초</td></tr>`).join('')}
      <tr><td></td><td colspan="3"><b>BGM</b> · ${trackLine()} · 0.3초 페이드 인 · 1.5초 페이드 아웃</td><td class="r num">${cutTotal(cuts).toFixed(1)}초</td></tr>
      </tbody></table></div>`;
    if($('#b-render')) $('#b-render').onclick=async()=>{ if(await post('render')){ toast('영상 제작을 시작했습니다'); startPoll(); route(); } };
    if($('#b-back')) $('#b-back').onclick=async()=>{ if(await post('back',{stage:'review'})) route(); };

  }
  if(S.stage==='done') doneView(Wf, con, cuts, img);
}

function doneView(Wf, con, cuts, img){
  const S=MST, V=S.video, starts=cutStarts(cuts);
  Wf.innerHTML = `<nav class="tabs" style="margin-top:0">${[['board','스토리보드'],['models','출연 캐릭터'],['upload','업로드 준비']].map(([k,l])=>`<button class="${k===doneTab?'on':''}" data-tab="${k}">${l}</button>`).join('')}</nav><div id="panel"></div>`;

  const P=$('#panel');
  if(doneTab==='board'){
    P.innerHTML = `<div class="sb"><div class="player">${V.file?`<video id="vid" src="${V.file}" poster="${V.poster||''}" controls playsinline preload="metadata"></video>`:`<div class="novideo">완성 영상 파일은 제작 PC에만 있습니다.<br>클라우드에는 컷 구성과 썸네일만 보관합니다.</div>`}
      <div class="pinfo"><span id="nowcut"></span><b class="num" id="tc"></b></div>
      <div class="actions" style="padding:8px 4px 2px">${V.file?`<a class="btn primary" href="${V.file}" download>MP4 다운로드</a>`:''}<button class="btn" id="b-back2">다시 만들기</button></div></div>
      <div><div class="row-h"><h2 class="sec">컷 구성</h2><span>컷을 누르면 영상이 그 장면으로 이동합니다 · ${V.t} 렌더 · ${V.duration}초</span></div>

/* ── 차트 (SVG, 호버 툴팁) ── */
function lineChart(el, {labels, series, yfmt=v=>fmt(Math.round(v)), h=220, xfmt=x=>x, marks=[]}){
  const W_=el.clientWidth||640, P={l:48,r:12,t:10,b:26}, iw=W_-P.l-P.r, ih=h-P.t-P.b;
  const max=Math.max(1,...series.flatMap(s=>s.values))*1.08, n=labels.length;
  const x=i=>P.l+iw*(n===1?0:i/(n-1)), y=v=>P.t+ih*(1-v/max);
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  let s=`<svg viewBox="0 0 ${W_} ${h}" height="${h}" role="img">`;
  ticks.forEach(t=>{ s+=`<line x1="${P.l}" x2="${W_-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#E9EAF1"/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#7A7F95" class="num">${yfmt(t)}</text>`; });
  marks.forEach(mk=>{ const xx=P.l+iw*mk.at; s+=`<line x1="${xx}" x2="${xx}" y1="${P.t}" y2="${P.t+ih}" stroke="#CDCFDB" stroke-dasharray="3 3"/><text x="${xx+4}" y="${P.t+10}" font-size="10.5" fill="#7A7F95">${esc(mk.label)}</text>`; });
  const step=Math.ceil(n/6); labels.forEach((l,i)=>{ if(i%step===0||i===n-1) s+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="11" fill="#7A7F95" class="num">${esc(xfmt(l))}</text>`; });
  series.forEach((se,si)=>{ const pts=se.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    if(si===0&&se.area) s+=`<polygon points="${P.l},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${se.color}" opacity=".08"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${se.dash?' stroke-dasharray="5 4"':''}/>`; });
  s+=`<line class="xh" y1="${P.t}" y2="${P.t+ih}" stroke="#1C1E2B" stroke-width="1" opacity="0"/>`;
  series.forEach((se,si)=> s+=`<circle class="hd hd${si}" r="4.5" fill="${se.color}" stroke="#fff" stroke-width="2" opacity="0"/>`);
  s+=`<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip');
  svg.querySelector('.hit').addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*(W_/r.width); const i=Math.max(0,Math.min(n-1,Math.round((px-P.l)/iw*(n-1))));
    svg.querySelector('.xh').setAttribute('x1',x(i)); svg.querySelector('.xh').setAttribute('x2',x(i)); svg.querySelector('.xh').setAttribute('opacity',.25);
    series.forEach((se,si)=>{ const c=svg.querySelector('.hd'+si); c.setAttribute('cx',x(i)); c.setAttribute('cy',y(se.values[i])); c.setAttribute('opacity',1); });
    tip.innerHTML=`${esc(xfmt(labels[i]))}<br>`+series.map(se=>`${esc(se.name)}${se.labels?' ('+esc(xfmt(se.labels[i]))+')':''} <b>${yfmt(se.values[i])}</b>`).join('<br>');
    tip.style.left=(x(i)/W_*r.width+18)+'px'; tip.style.top=(Math.min(...series.map(se=>y(se.values[i])))/h*r.height+40)+'px'; tip.style.opacity=1;
  });
  svg.querySelector('.hit').addEventListener('mouseleave',()=>{ tip.style.opacity=0; svg.querySelectorAll('.hd,.xh').forEach(c=>c.setAttribute('opacity',0)); });
}
function hbar(el, rows, {color='var(--s1)', unit='%'}={}){
  const max=Math.max(...rows.map(r=>r[1]));
  el.innerHTML = `<div class="funnel">${rows.map(r=>`<div class="frow" title="${esc(r[0])} ${r[1]}${unit}"><span>${esc(r[0])}</span><span class="fbar"><i style="width:${r[1]/max*100}%;background:${color}"></i></span><span class="r num"><b>${r[1]}${unit}</b></span></div>`).join('')}</div>`;
}
function groupBar(el, rows, names_, colors){
  const W_=el.clientWidth||640, h=230, P={l:36,r:8,t:16,b:26}, iw=W_-P.l-P.r, ih=h-P.t-P.b;
  const max=Math.max(...rows.flatMap(r=>[r[1],r[2]]))*1.15||1, gw=iw/rows.length, bw=Math.min(22,(gw-14)/2);
  let s=`<svg viewBox="0 0 ${W_} ${h}" height="${h}" role="img">`;
  [0,.5,1].forEach(t=>{ const yy=P.t+ih*(1-t); s+=`<line x1="${P.l}" x2="${W_-P.r}" y1="${yy}" y2="${yy}" stroke="#E9EAF1"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="#7A7F95">${(max*t).toFixed(0)}%</text>`; });
  rows.forEach((r,i)=>{ const cx=P.l+gw*i+gw/2;
    [1,2].forEach((k,j)=>{ const v=r[k], bh=ih*v/max, xx=cx+(j===0?-bw-1:1), yy=P.t+ih-bh;
      s+=`<path d="M${xx},${P.t+ih} V${yy+4} Q${xx},${yy} ${xx+4},${yy} H${xx+bw-4} Q${xx+bw},${yy} ${xx+bw},${yy+4} V${P.t+ih}Z" fill="${colors[j]}"><title>${r[0]} ${names_[j]} ${v}%</title></path>`; });
    s+=`<text x="${cx}" y="${h-6}" text-anchor="middle" font-size="11" fill="#7A7F95" class="num">${r[0]}</text>`; });
  el.innerHTML=s+'</svg>';
}

    <div class="chart wide"><h3>일별 조회수</h3><div class="sub">views · engagedViews (dimensions=day)${cmpOk?' · 점선은 이전 기간의 같은 순번 날짜':''}</div>
      <div class="legend"><span><i style="background:var(--s1)"></i>조회수</span>${R.daily.engagedViews?'<span><i style="background:var(--s2)"></i>참여 조회수</span>':''}${cmpOk?'<span><i class="dash"></i>이전 기간 조회수</span>':''}</div><div id="c-daily"></div></div>
    <div class="chart"><h3>시청 유지율</h3><div class="sub">audienceWatchRatio (dimensions=elapsedVideoTimeRatio) · 컷 경계 표시 — 첫 컷(훅) 구간 이탈을 확인하세요</div><div id="c-ret"></div></div>
    <div class="chart"><h3>유입 경로</h3><div class="sub">insightTrafficSourceType · 조회수 비중 — Shorts 피드 비중이 높을수록 알고리즘 노출</div><div id="c-src"></div></div>
    <div class="chart"><h3>시청자 연령 · 성별</h3><div class="sub">viewerPercentage (dimensions=ageGroup,gender)</div>
      <div class="legend"><span><i style="background:var(--s2)"></i>남성</span><span><i style="background:var(--s1)"></i>여성</span></div><div id="c-age"></div></div>
    <div class="chart"><h3>국가 TOP 5</h3><div class="sub">country · 조회수 비중</div><div id="c-reg"></div></div>
    <div class="chart wide"><h3>일별 데이터 표</h3><div class="sub">차트와 같은 값 · 표로 확인</div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>날짜</th><th class="r">조회수</th><th class="r">참여 조회수</th><th class="r">좋아요</th><th class="r">공유</th><th class="r">구독 증가</th><th class="r">링크 방문</th></tr></thead>
      <tbody>${R.daily.date.map((d,i)=>{ const g=a=>a?fmt(a[i]):'—'; return `<tr><td class="num">${d}</td><td class="r num">${fmt(R.daily.views[i])}</td><td class="r num">${g(R.daily.engagedViews)}</td><td class="r num">${g(R.daily.likes)}</td><td class="r num">${g(R.daily.shares)}</td><td class="r num">${g(R.daily.subscribersGained)}</td><td class="r num">${g(R.daily.landing)}</td></tr>`; }).join('')}</tbody></table></div></div>
  </div>`;
  const xf=d=>d.slice(5).replace('-','/');
  const ser=[{name:'조회수',values:R.daily.views,color:'#C7742B',area:true}];
  if(R.daily.engagedViews) ser.push({name:'참여 조회수',values:R.daily.engagedViews,color:'#3D5BB8'});
  if(cmpOk) ser.push({name:'이전 기간 조회수',values:P.daily.views,color:'#9A9DB0',dash:true,labels:P.daily.date});
  lineChart($('#c-daily'),{labels:R.daily.date,series:ser,xfmt:xf});
  if(R.retention&&R.retention.length){ const marks=con?(()=>{ const st=cutStarts(con.cuts), tt=cutTotal(con.cuts); return con.cuts.slice(1).map((c,i)=>({at:st[i+1]/tt,label:c.id})); })():[];
    lineChart($('#c-ret'),{labels:R.retention.map((_,i)=>i/40),series:[{name:'시청 유지',values:R.retention,color:'#C7742B',area:true}],yfmt:x=>Math.round(x*100)+'%',xfmt:x=>Math.round(x*100)+'%',h:210,marks}); }
  else $('#c-ret').innerHTML='<p class="muted">이 기간에는 유지율 데이터가 없습니다.</p>';
  const bars=(el,rows,f)=>rows&&rows.length?f():(el.innerHTML='<p class="muted">데이터 없음</p>');
  bars($('#c-src'),R.traffic,()=>hbar($('#c-src'),R.traffic)); bars($('#c-reg'),R.region,()=>hbar($('#c-reg'),R.region));
  bars($('#c-age'),R.age,()=>groupBar($('#c-age'),R.age,['남성','여성'],['#3D5BB8','#C7742B']));
}
function dashCsv(){
  if(!DCUR) return; const d=DCUR.daily, keys=['views','engagedViews','estimatedMinutesWatched','averageViewPercentage','likes','comments','shares','subscribersGained','subscribersLost','landing','formStart','consultSubmit'];
  const rows=[['date',...keys].join(',')].concat(d.date.map((x,i)=>[x,...keys.map(k=>d[k]?d[k][i]:'')].join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv'})); a.download=`JHS-SF-${W}_${DR.s}_${DR.e}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ── 라우팅 ── */
async function route(){
  const h=location.hash||'#/w/', p=h.slice(2).split('/');
  $('#btn-prof').classList.toggle('on', p[0]==='profiles'); $('#btn-dash').classList.toggle('on', p[0]==='dash');
  if(p[0]==='profiles'){ renderSide(null); viewProfiles(p[1]); window.scrollTo(0,0); return; }
  const w=/^\d{4}-W\d{2}$/.test(p[1]||'')?p[1]:CUR;
  if(w!==W||!MST||MST.week!==w) await getState(w);
  $('#btn-dash').setAttribute('href','#/dash/'+w);
  renderSide(w);
  if(p[0]==='dash') await viewDash(); else if(p[0]==='doc') viewDoc(); else viewWeek();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
(async()=>{ if(CLOUD){ await cloudBoot(); } else { API=await ping(); }
  await loadWeeks(); await route(); if((API||CLOUD)&&MST&&MST.job&&MST.job.running) startPoll(); })();
</script>
